name: Publish package

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require a tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::This workflow must run on a v*.*.* tag ref, got $GITHUB_REF"
            exit 1
          fi

      - name: Update package.json
        run: |
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          PACKAGE_VERSION=${TAG_NAME#v}
          echo "Updating package.json to version $PACKAGE_VERSION"
          cat <<< $(jq -r ".version=\"$PACKAGE_VERSION\"" package.json) > package.json
          cat package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish --access public
        working-directory: dist

  publish-to-github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: ${{ github.repository_owner }}

      - name: Require a tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::This workflow must run on a v*.*.* tag ref, got $GITHUB_REF"
            exit 1
          fi

      - name: Update package.json
        run: |
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          PACKAGE_VERSION=${TAG_NAME#v}
          echo "Updating package.json to version $PACKAGE_VERSION"
          cat <<< $(jq -r ".version=\"$PACKAGE_VERSION\"" package.json) > package.json
          cat package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish
        run: yarn publish
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
